<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D World Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            background-color: #f8fafc;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .interactive-ui {
            pointer-events: auto;
        }

        /* Smooth Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Custom Scrollbar for Modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #2563eb;
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer w-full h-screen flex flex-col justify-between p-6 md:p-8">

        <!-- Header / Navigation Bar -->
        <header class="flex justify-between items-center w-full max-w-7xl mx-auto">
            <div class="interactive-ui flex items-center space-x-3 glass-card px-5 py-3 rounded-2xl shadow-sm">
                <div class="w-3 h-3 rounded-full bg-blue-600 animate-pulse"></div>
                <span class="font-bold text-slate-800 tracking-wide text-sm md:text-base">ALEX.DEV <span class="text-blue-600 font-normal">| 3D World</span></span>
            </div>

            <!-- Fast Travel Controls (HUD UX) -->
            <nav class="interactive-ui hidden md:flex items-center space-x-2 glass-card p-1.5 rounded-2xl shadow-sm">
                <button onclick="focusZone('hero')" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition-all">Start</button>
                <button onclick="focusZone('projects')" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition-all">Projects Zone</button>
                <button onclick="focusZone('skills')" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition-all">Skills Tree</button>
                <button onclick="focusZone('contact')" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition-all">Contact Station</button>
            </nav>

            <div class="interactive-ui flex items-center space-x-2">
                <button id="sound-btn" onclick="toggleSound()" class="glass-card p-3 rounded-2xl shadow-sm hover:border-blue-300 text-slate-600 hover:text-blue-600 transition-all">
                    <i data-lucide="volume-2" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- Dynamic Context Info Panel (Bottom Left) -->
        <div class="w-full max-w-7xl mx-auto flex justify-between items-end">
            <div id="info-panel" class="interactive-ui glass-card p-6 rounded-3xl max-w-md shadow-xl transition-all transform translate-y-0 duration-500">
                <span id="zone-badge" class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg bg-blue-100 text-blue-700 inline-block mb-2">Welcome Area</span>
                <h1 id="zone-title" class="text-2xl font-bold text-slate-900 mb-1">Halo, Saya Alex</h1>
                <p id="zone-desc" class="text-xs md:text-sm text-slate-600 leading-relaxed mb-4">Selamat datang di portofolio 3D saya. Klik objek atau gunakan navigasi untuk menjelajahi karya & keahlian saya.</p>
                <div id="zone-action">
                    <button onclick="focusZone('projects')" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-3 px-5 rounded-xl shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center space-x-2">
                        <span>Mulai Jelajah</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Controls Guide (Bottom Right) -->
            <div class="interactive-ui hidden lg:flex items-center space-x-4 glass-card px-5 py-3 rounded-2xl text-xs text-slate-500 shadow-sm">
                <span class="flex items-center space-x-1.5">
                    <kbd class="px-2 py-1 bg-slate-100 border border-slate-200 rounded-md font-mono text-slate-700">Drag</kbd>
                    <span>Rotasi Kamera</span>
                </span>
                <span class="text-slate-300">•</span>
                <span class="flex items-center space-x-1.5">
                    <kbd class="px-2 py-1 bg-slate-100 border border-slate-200 rounded-md font-mono text-slate-700">Click</kbd>
                    <span>Pilih Objek</span>
                </span>
            </div>
        </div>
    </div>

    <!-- Modal Popup Detail (Hidden by default) -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-card bg-white/95 rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl border border-white transform scale-95 transition-transform duration-300 relative" id="modal-box">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-700 p-1 rounded-xl hover:bg-slate-100 transition-all">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <span id="modal-category" class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg bg-blue-100 text-blue-700 inline-block mb-3">Project Showcase</span>
            <h2 id="modal-title" class="text-xl font-bold text-slate-900 mb-2">Title</h2>
            <p id="modal-body" class="text-sm text-slate-600 leading-relaxed mb-6">Description goes here...</p>
            <div class="flex items-center space-x-3" id="modal-footer">
                <a id="modal-link" href="#" target="_blank" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-3 px-4 rounded-xl text-center shadow-lg shadow-blue-500/20 transition-all">Lihat Demo Live</a>
                <button onclick="closeModal()" class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition-all">Tutup</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Init Lucide Icons
        lucide.createIcons();

        // Audio State
        let soundEnabled = false;
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-btn');
            btn.innerHTML = soundEnabled 
                ? `<i data-lucide="volume-2" class="w-5 h-5 text-blue-600"></i>`
                : `<i data-lucide="volume-x" class="w-5 h-5 text-slate-400"></i>`;
            lucide.createIcons();
        }

        // Three.js Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf8fafc);
        scene.fog = new THREE.FogExp2(0xf8fafc, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Grid Floor (Clean Minimalist Style)
        const gridHelper = new THREE.GridHelper(100, 50, 0x2563eb, 0xe2e8f0);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        // Materials
        const blueMaterial = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.3, metalness: 0.1 });
        const lightBlueMaterial = new THREE.MeshStandardMaterial({ color: 0x60a5fa, roughness: 0.2 });
        const whiteMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
        const glassMaterial = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.9, opacity: 1, transparent: true, roughness: 0.1 });

        // Interactive Objects / Interactive Islands
        const interactiveObjects = [];

        function createZoneIsland(x, z, size, colorHex) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            // Platform Base
            const geo = new THREE.CylinderGeometry(size, size + 0.5, 0.4, 32);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const platform = new THREE.Mesh(geo, mat);
            platform.position.y = -0.2;
            platform.receiveShadow = true;
            group.add(platform);

            // Accent Ring
            const ringGeo = new THREE.TorusGeometry(size + 0.1, 0.05, 16, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.01;
            group.add(ring);

            scene.add(group);
            return group;
        }

        // Zone 1: Hero Node (Center)
        createZoneIsland(0, 0, 3, 0x2563eb);
        const heroCoreGeo = new THREE.IcosahedronGeometry(1.2, 0);
        const heroCore = new THREE.Mesh(heroCoreGeo, blueMaterial);
        heroCore.position.set(0, 1.8, 0);
        heroCore.castShadow = true;
        heroCore.userData = { id: 'hero', name: 'Core Zone', type: 'info' };
        scene.add(heroCore);
        interactiveObjects.push(heroCore);

        // Zone 2: Projects Zone (Left)
        createZoneIsland(-8, -4, 3.5, 0x3b82f6);
        const projectCubeGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const projectCube = new THREE.Mesh(projectCubeGeo, lightBlueMaterial);
        projectCube.position.set(-8, 1.5, -4);
        projectCube.castShadow = true;
        projectCube.userData = { 
            id: 'projects', 
            name: 'Aplikasi E-Commerce 3D', 
            type: 'modal',
            badge: 'Proyek Unggulan',
            desc: 'Platform toko online interaktif dengan pratinjau produk 3D real-time menggunakan Three.js dan React.',
            link: '#'
        };
        scene.add(projectCube);
        interactiveObjects.push(projectCube);

        // Zone 3: Skills Zone (Right)
        createZoneIsland(8, -4, 3.5, 0x60a5fa);
        const skillOctaGeo = new THREE.OctahedronGeometry(1.3);
        const skillOcta = new THREE.Mesh(skillOctaGeo, whiteMaterial);
        skillOcta.position.set(8, 1.5, -4);
        skillOcta.castShadow = true;
        skillOcta.userData = { 
            id: 'skills', 
            name: 'Keahlian & Tools', 
            type: 'modal',
            badge: 'Tech Stack',
            desc: 'Frontend: React, Tailwind CSS, Three.js, TypeScript.\nBackend: Node.js, Express, PostgreSQL.\nTools: Figma, Blender, Git.',
            link: '#'
        };
        scene.add(skillOcta);
        interactiveObjects.push(skillOcta);

        // Zone 4: Contact Zone (Back)
        createZoneIsland(0, -12, 3, 0x1d4ed8);
        const contactTorusGeo = new THREE.TorusKnotGeometry(0.8, 0.25, 100, 16);
        const contactTorus = new THREE.Mesh(contactTorusGeo, blueMaterial);
        contactTorus.position.set(0, 1.8, -12);
        contactTorus.castShadow = true;
        contactTorus.userData = { 
            id: 'contact', 
            name: 'Kontak & Diskusi', 
            type: 'modal',
            badge: 'Hubungi Saya',
            desc: 'Tertarik untuk bekerja sama atau membuat proyek 3D serupa? Kirimkan pesan melalui email di alex@example.com.',
            link: 'mailto:alex@example.com'
        };
        scene.add(contactTorus);
        interactiveObjects.push(contactTorus);

        // Camera Camera Target System
        let targetCameraPos = new THREE.Vector3(0, 6, 12);
        let targetLookAt = new THREE.Vector3(0, 1, 0);
        let currentLookAt = new THREE.Vector3(0, 1, 0);

        camera.position.set(0, 6, 12);
        camera.lookAt(currentLookAt);

        // Zone Camera Configurations
        const zoneViews = {
            hero: { cam: new THREE.Vector3(0, 5, 10), look: new THREE.Vector3(0, 1.5, 0) },
            projects: { cam: new THREE.Vector3(-8, 4, 3), look: new THREE.Vector3(-8, 1.5, -4) },
            skills: { cam: new THREE.Vector3(8, 4, 3), look: new THREE.Vector3(8, 1.5, -4) },
            contact: { cam: new THREE.Vector3(0, 5, -5), look: new THREE.Vector3(0, 1.8, -12) }
        };

        const zoneData = {
            hero: {
                badge: "Welcome Area",
                title: "Halo, Saya Alex",
                desc: "Selamat datang di portofolio 3D saya. Klik objek di dunia ini untuk melihat detail proyek dan keahlian saya.",
                btnText: "Jelajahi Proyek",
                targetZone: "projects"
            },
            projects: {
                badge: "Exhibition Zone",
                title: "Galeri Proyek",
                desc: "Kumpulan proyek aplikasi web interaktif, visualisasi 3D, dan desain UI/UX yang telah saya selesaikan.",
                btnText: "Buka Detail Proyek",
                action: () => openModal(projectCube.userData)
            },
            skills: {
                badge: "Skills Tree",
                title: "Keahlian Utama",
                desc: "Spesialisasi dalam pemograman Web Frontend modern, grafis 3D interaktif, dan arsitektur UI/UX.",
                btnText: "Daftar Lengkap Skills",
                action: () => openModal(skillOcta.userData)
            },
            contact: {
                badge: "Contact Station",
                title: "Mari Bekerja Sama",
                desc: "Siap membantu mewujudkan ide web interaktif Anda. Hubungi saya untuk konsultasi atau penawaran proyek.",
                btnText: "Kirim Email",
                action: () => openModal(contactTorus.userData)
            }
        };

        function focusZone(zoneKey) {
            const config = zoneViews[zoneKey];
            const data = zoneData[zoneKey];

            if (config && data) {
                targetCameraPos.copy(config.cam);
                targetLookAt.copy(config.look);

                // Update UI Info Panel
                document.getElementById('zone-badge').innerText = data.badge;
                document.getElementById('zone-title').innerText = data.title;
                document.getElementById('zone-desc').innerText = data.desc;

                const actionDiv = document.getElementById('zone-action');
                if (data.targetZone) {
                    actionDiv.innerHTML = `
                        <button onclick="focusZone('${data.targetZone}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-3 px-5 rounded-xl shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center space-x-2">
                            <span>${data.btnText}</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    `;
                } else if (data.action) {
                    actionDiv.innerHTML = `
                        <button id="dynamic-action-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-3 px-5 rounded-xl shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center space-x-2">
                            <span>${data.btnText}</span>
                            <i data-lucide="external-link" class="w-4 h-4"></i>
                        </button>
                    `;
                    document.getElementById('dynamic-action-btn').onclick = data.action;
                }
                lucide.createIcons();
            }
        }

        // Raycasting for Object Interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            // Ignore UI clicks
            if (e.target.closest('.interactive-ui') || e.target.closest('#modal-overlay')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                const obj = intersects[0].object;
                focusZone(obj.userData.id);
                if (obj.userData.type === 'modal') {
                    openModal(obj.userData);
                }
            }
        });

        // Modal Handlers
        function openModal(data) {
            document.getElementById('modal-category').innerText = data.badge || 'Detail';
            document.getElementById('modal-title').innerText = data.name;
            document.getElementById('modal-body').innerText = data.desc;
            document.getElementById('modal-link').href = data.link || '#';

            const modal = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
        }

        // Mouse Drag / Orbit Logic Simple
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('.interactive-ui')) return;
            isDragging = true;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };

            // Slight camera offset on drag
            targetCameraPos.x -= deltaMove.x * 0.01;
            targetCameraPos.y += deltaMove.y * 0.01;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotate objects gently
            heroCore.rotation.y = elapsedTime * 0.5;
            heroCore.rotation.x = Math.sin(elapsedTime * 0.3) * 0.2;

            projectCube.rotation.y = elapsedTime * 0.4;
            projectCube.position.y = 1.5 + Math.sin(elapsedTime * 2) * 0.1;

            skillOcta.rotation.y = -elapsedTime * 0.3;
            skillOcta.position.y = 1.5 + Math.cos(elapsedTime * 2) * 0.1;

            contactTorus.rotation.x = elapsedTime * 0.4;
            contactTorus.rotation.y = elapsedTime * 0.2;

            // Smooth Camera Transition (Lerp)
            camera.position.lerp(targetCameraPos, 0.05);
            currentLookAt.lerp(targetLookAt, 0.05);
            camera.lookAt(currentLookAt);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
